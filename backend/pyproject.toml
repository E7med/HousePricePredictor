[project]
name = "house-price-predictor"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "httpx2==2.12.0",
    "numpy==2.5.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*"]
